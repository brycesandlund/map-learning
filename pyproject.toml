[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "map-learning"
version = "0.1.0"
description = "Distance representation learning and latent planning in continuous mazes"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.2", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
map-learning = "map_learning.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
